site_name: DeepWave Module Developer Docs
site_description: Enterprise documentation portal for external module developers.
site_author: DeepWave Engineering
site_url: https://docs.deepwave.local/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: material/book-open-page-variant
  favicon: material/book-open-page-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: teal
    - scheme: slate
      primary: blue
      accent: teal

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
          link: /
          site_name: DeepWave Module Developer Docs
          site_description: Enterprise documentation portal for external module developers.
          nav:
            - Home: en/index.md
            - Getting Started:
                - Overview: en/getting-started/overview.md
            - Architecture:
                - Public Architecture: en/architecture/public-architecture.md
            - Module Developer Guide:
                - Module Contract: en/module-developer-guide/module-contract.md
                - Module Types: en/module-developer-guide/module-types.md
                - Validation and Ordering: en/module-developer-guide/validation-and-ordering.md
                - Configuration and DSL: en/module-developer-guide/configuration-and-dsl.md
                - Templates and Examples: en/module-developer-guide/templates-and-examples.md
                - Testing and Debugging: en/module-developer-guide/testing-and-debugging.md
            - Reference:
                - Public API Boundary: en/reference/public-api-boundary.md
                - Glossary: en/reference/glossary.md
            - Governance:
                - Contribution Workflow: en/governance/contribution-workflow.md
        - locale: zh
          name: 简体中文
          build: true
          link: /zh/
          site_name: DeepWave 模块开发者文档
          site_description: 面向外部模块开发者的企业级静态文档站点。
          nav:
            - 首页: zh/index.md
            - 快速开始:
                - 概览: zh/getting-started/overview.md
            - 架构说明:
                - 公开架构: zh/architecture/public-architecture.md
            - 模块开发指南:
                - 模块契约: zh/module-developer-guide/module-contract.md
                - 模块类型: zh/module-developer-guide/module-types.md
                - 校验与排序: zh/module-developer-guide/validation-and-ordering.md
                - 配置与 DSL: zh/module-developer-guide/configuration-and-dsl.md
                - 模板与示例: zh/module-developer-guide/templates-and-examples.md
                - 测试与调试: zh/module-developer-guide/testing-and-debugging.md
            - 参考资料:
                - 公开 API 边界: zh/reference/public-api-boundary.md
                - 术语表: zh/reference/glossary.md
            - 文档治理:
                - 贡献流程: zh/governance/contribution-workflow.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
